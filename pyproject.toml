[project]
name = "bi-dash"
version = "0.1.0"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::Warning:boto3.compat",
    "ignore::DeprecationWarning:dash.development.base_component",
]
addopts = "--cov=src --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "backend"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
allow_untyped_calls = true
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true
