[project]
name = "bi-dash"
version = "0.1.0"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::Warning:boto3.compat",
    "ignore::DeprecationWarning:dash.development.base_component",
]
addopts = "--cov=src --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "backend"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
exclude = ["venv/", ".venv/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dash.*"
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "dash_table.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dash_bootstrap_components.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dash_mantine_components.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flask_caching.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flask_login.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "_pytest.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "src.data.type_inferrer"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "src.components.filters"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "src.charts.table_builder"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "src.pages.hamm_overview._data_loader"
disable_error_code = ["union-attr", "return-value", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "src.pages.apac_dot_due_date._data_loader"
disable_error_code = ["assignment"]
